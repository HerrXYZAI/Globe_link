<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Globe</title>
<!-- Where the track data comes from: api.php (PHP install) or api.json (static export, e.g. GitHub Pages) -->
<meta name="globe-link-data" content="api.php">
<link rel="stylesheet" href="assets/globe.css">
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.45.3/dist/globe.gl.min.js"></script>
</head>
<body>
<div id="globe"></div>

<header id="topbar">
    <h1 id="title">Travel Globe</h1>
    <button id="list-toggle" type="button" aria-expanded="false" aria-controls="track-list">Tracks</button>
</header>

<aside id="track-list" hidden>
    <ul></ul>
</aside>

<div id="popup" role="dialog" aria-live="polite" hidden>
    <button class="close" type="button" aria-label="Close">×</button>
    <img alt="" hidden>
    <div class="body">
        <h2></h2>
        <div class="meta"></div>
        <p class="text"></p>
        <a class="more" hidden>Read article →</a>
    </div>
</div>

<div id="status">Loading tracks…</div>
<div id="attribution"></div>

<script src="assets/globe.js"></script>
</body>
</html>
